name: pandas CI cache experiment
run-name: 'pandas / ${{ inputs.provider }} / ${{ inputs.phase }} / ${{ inputs.cohort }}'
on:
  workflow_dispatch:
    inputs:
      provider:
        type: choice
        options: [github, namespace]
        required: true
      phase:
        type: choice
        options: [cold, warm, edited]
        required: true
      cohort:
        default: pandas-1
        required: true
      namespace_runner:
        default: namespace-profile-ci-lab
        required: true
permissions:
  contents: read
concurrency:
  group: pandas-ci-lab-${{ inputs.provider }}-${{ inputs.cohort }}
  cancel-in-progress: false
jobs:
  ci:
    runs-on: ${{ inputs.provider == 'github' && 'ubuntu-24.04' || inputs.namespace_runner }}
    timeout-minutes: 25
    env:
      PHASE: ${{ inputs.phase }}
      PROVIDER: ${{ inputs.provider }}
      COHORT: ${{ inputs.cohort }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      PIXI_CACHE_DIR: ${{ github.workspace }}/pandas-cache/${{ inputs.cohort }}/pixi
      CCACHE_DIR: ${{ github.workspace }}/pandas-cache/${{ inputs.cohort }}/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}/upstream-pandas
      CCACHE_MAXSIZE: 2G
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: pandas-dev/pandas
          ref: 717bcd3eda554a0b2e826889f9e30efbd88f00cd
          path: upstream-pandas
          persist-credentials: false
      - name: Install compiler cache
        run: sudo apt-get update -qq && sudo apt-get install -y ccache
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e
        with:
          pixi-version: v0.82.1
          run-install: false
          cache: false
      - name: Restore GitHub caches
        if: inputs.provider == 'github'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: pandas-cache/${{ inputs.cohort }}
          key: pandas-${{ inputs.cohort }}-${{ hashFiles('upstream-pandas/pixi.lock') }}
      - name: Attach Namespace caches
        if: inputs.provider == 'namespace'
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9
        with:
          path: pandas-cache/${{ inputs.cohort }}
      - name: Measure environment, source build, and groupby tests
        run: python3 scripts/measure_pandas.py
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pandas-${{ inputs.provider }}-${{ inputs.phase }}-${{ github.run_id }}
          path: results/pandas/
          retention-days: 90
